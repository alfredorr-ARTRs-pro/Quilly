name: CI

on:
  push:
    branches: [main, latest]
  pull_request:
    branches: [main, latest]

# Cancel in-progress runs on new pushes to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, test & build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest covers the NSIS target; macos-14 is an arm64 runner
        # matching the Apple Silicon release target.
        os: [windows-latest, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22+: `node --test` expands globs itself — required on Windows,
          # where no shell expands electron/*.test.cjs for us.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build renderer (Vite)
        run: npm run build
